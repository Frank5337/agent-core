<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Website RAG Studio</title>
  <style>
    :root {
      --bg: #f3efe4;
      --panel: rgba(255, 251, 242, 0.94);
      --ink: #1f2a24;
      --muted: #627067;
      --accent: #1d6b52;
      --accent-soft: rgba(29, 107, 82, 0.1);
      --line: rgba(31, 42, 36, 0.1);
      --shadow: 0 24px 70px rgba(36, 49, 41, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(211, 159, 52, 0.18), transparent 28%),
        radial-gradient(circle at top right, rgba(29, 107, 82, 0.14), transparent 30%),
        linear-gradient(180deg, #f8f4ea 0%, var(--bg) 100%);
    }

    .page {
      max-width: 1440px;
      margin: 0 auto;
      padding: 32px 20px 56px;
    }

    .hero,
    .workspace {
      display: grid;
      gap: 22px;
    }

    .hero {
      grid-template-columns: minmax(420px, 1fr) minmax(420px, 1fr);
      align-items: stretch;
    }

    .workspace {
      grid-template-columns: minmax(460px, 0.9fr) minmax(600px, 1.2fr);
      margin-top: 22px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .intro,
    .ingest,
    .website-info,
    .qa {
      padding: 24px 26px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(34px, 4vw, 56px);
      line-height: 1.02;
      letter-spacing: -0.04em;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.75;
    }

    .meta {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 24px;
    }

    .meta-card,
    .detail-item,
    .citation,
    .page-item {
      padding: 14px 16px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid var(--line);
    }

    .meta-card strong {
      display: block;
      margin-top: 6px;
      font-size: 24px;
    }

    .ingest {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .field-grid {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
    }

    input,
    textarea,
    button {
      font: inherit;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid rgba(31, 42, 36, 0.14);
      background: rgba(255, 255, 255, 0.9);
      border-radius: 16px;
      padding: 14px 16px;
      outline: none;
      transition: border-color .2s ease, transform .2s ease;
    }

    input:focus,
    textarea:focus {
      border-color: rgba(29, 107, 82, 0.45);
      transform: translateY(-1px);
    }

    textarea {
      min-height: 150px;
      resize: vertical;
      line-height: 1.7;
    }

    .toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.72);
    }

    .toggle input {
      width: auto;
      margin: 0;
      transform: scale(1.15);
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    button {
      border: 0;
      border-radius: 16px;
      padding: 14px 20px;
      cursor: pointer;
      transition: transform .18s ease, opacity .18s ease, box-shadow .18s ease;
    }

    button:hover { transform: translateY(-1px); }
    button:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

    .primary {
      background: linear-gradient(135deg, var(--accent) 0%, #245f4c 100%);
      color: #fff;
      font-weight: 700;
      box-shadow: 0 14px 36px rgba(29, 107, 82, 0.24);
    }

    .secondary {
      background: rgba(31, 42, 36, 0.06);
      color: var(--ink);
      font-weight: 600;
    }

    .status {
      min-height: 24px;
      font-size: 14px;
      color: var(--muted);
    }

    .detail-grid,
    .pages-list,
    .citations,
    .question-box {
      display: grid;
      gap: 12px;
    }

    .citation-toggle {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(29, 107, 82, 0.18);
      background: rgba(29, 107, 82, 0.08);
      color: var(--accent);
      font-weight: 700;
      box-shadow: none;
    }

    .citation-toggle:hover {
      box-shadow: none;
    }

    .citations {
      margin-top: 12px;
    }

    .website-info {
      min-height: 760px;
    }

    .pages-list {
      margin-top: 14px;
    }

    .detail-item code,
    .page-item .muted,
    .citation .muted {
      word-break: break-all;
    }

    .qa {
      position: sticky;
      top: 18px;
      min-height: 760px;
      display: grid;
      grid-template-rows: auto auto minmax(420px, 1fr) auto;
      gap: 14px;
    }

    .qa-header {
      display: grid;
      gap: 8px;
    }

    .chat-history {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 420px;
      max-height: 620px;
      overflow: auto;
      padding-right: 4px;
    }

    .bubble {
      border-radius: 18px;
      padding: 18px 20px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.82);
      line-height: 1.75;
      white-space: pre-wrap;
      font-size: 16px;
    }

    .bubble.user {
      background: rgba(29, 107, 82, 0.12);
      border-color: rgba(29, 107, 82, 0.2);
    }

    .bubble.answer {
      background: rgba(255, 250, 240, 0.94);
    }

    .question-box {
      padding-top: 6px;
      border-top: 1px solid rgba(31, 42, 36, 0.08);
    }

    .composer-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .hint {
      font-size: 13px;
      color: var(--muted);
    }

    .muted {
      color: var(--muted);
    }

    @media (max-width: 1180px) {
      .hero,
      .workspace {
        grid-template-columns: 1fr;
      }

      .qa {
        position: static;
        min-height: 0;
      }

      .website-info {
        min-height: 0;
      }
    }

    @media (max-width: 760px) {
      .field-grid,
      .meta {
        grid-template-columns: 1fr;
      }

      .page {
        padding-inline: 14px;
      }

      .intro,
      .ingest,
      .website-info,
      .qa {
        padding: 20px 18px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <section class="hero">
      <div class="panel intro">
        <div class="badge">Website RAG Studio</div>
        <h1>输入一个网站地址，<br>把它变成可问答的知识页</h1>
        <p>这一版会抓取起始页面，并继续抓取同域下的多个页面，把正文切片后放进知识库。导入完成后，你就能直接针对这个网站提问。</p>
        <div class="meta">
          <div class="meta-card">
            <span class="muted">步骤一</span>
            <strong>抓取页面</strong>
          </div>
          <div class="meta-card">
            <span class="muted">步骤二</span>
            <strong>切片入库</strong>
          </div>
          <div class="meta-card">
            <span class="muted">步骤三</span>
            <strong>对话问答</strong>
          </div>
        </div>
      </div>

      <div class="panel ingest">
        <div class="field-grid">
          <div class="field full">
            <label class="label" for="websiteUrl">网站地址</label>
            <input id="websiteUrl" placeholder="https://example.com" />
          </div>

          <div class="field">
            <label class="label" for="kbName">知识库名称</label>
            <input id="kbName" placeholder="留空则自动使用域名" />
          </div>

          <div class="field">
            <label class="label" for="maxPages">抓取页数上限</label>
            <input id="maxPages" type="number" min="1" max="20" value="5" />
          </div>

          <div class="field full">
            <label class="toggle">
              <input id="sameDomainOnly" type="checkbox" checked />
              <span>仅抓取同域页面</span>
            </label>
          </div>
        </div>

        <div class="actions">
          <button id="ingestButton" class="primary">抓取并入库</button>
          <button id="clearButton" class="secondary">清空当前会话</button>
        </div>

        <div id="ingestStatus" class="status"></div>
      </div>
    </section>

    <section class="workspace">
      <div class="panel website-info">
        <h2>网站内容</h2>
        <p class="muted">导入成功后，这里会显示当前知识库、抓取页数和页面列表。</p>
        <div id="details" class="detail-grid">
          <div class="detail-item">还没有导入网站内容。</div>
        </div>
        <div id="pagesList" class="pages-list"></div>
      </div>

      <div class="panel qa">
        <div class="qa-header">
          <h2>问答界面</h2>
          <p class="muted">这里现在会更宽一些，适合连续追问。你可以直接问“这个网站主要介绍什么”“有哪些栏目”“某一页提到了什么”。</p>
        </div>

        <div id="chatHistory" class="chat-history">
          <div class="bubble answer">先在左侧输入网站地址并完成导入，然后这里就可以开始问答。</div>
        </div>

        <div class="question-box">
          <textarea id="questionInput" placeholder="例如：这个网站主要介绍了什么？"></textarea>
          <div class="composer-actions">
            <span class="hint">建议直接问具体一点，比如“这个网站有哪些内容栏目”。</span>
            <button id="askButton" class="primary" disabled>开始提问</button>
          </div>
          <div id="askStatus" class="status"></div>
        </div>
      </div>
    </section>
  </div>

  <script>
    const state = {
      knowledgeBaseId: null,
      pages: []
    };

    const websiteUrlInput = document.getElementById("websiteUrl");
    const kbNameInput = document.getElementById("kbName");
    const maxPagesInput = document.getElementById("maxPages");
    const sameDomainOnlyInput = document.getElementById("sameDomainOnly");
    const ingestButton = document.getElementById("ingestButton");
    const clearButton = document.getElementById("clearButton");
    const ingestStatus = document.getElementById("ingestStatus");
    const askButton = document.getElementById("askButton");
    const askStatus = document.getElementById("askStatus");
    const questionInput = document.getElementById("questionInput");
    const details = document.getElementById("details");
    const pagesList = document.getElementById("pagesList");
    const chatHistory = document.getElementById("chatHistory");

    function setStatus(element, text) {
      element.textContent = text;
    }

    function renderDetails(payload) {
      details.innerHTML = `
        <div class="detail-item"><span class="muted">知识库</span><br><strong>${payload.knowledge_base_name}</strong></div>
        <div class="detail-item"><span class="muted">知识库 ID</span><br><code>${payload.knowledge_base_id}</code></div>
        <div class="detail-item"><span class="muted">抓取页面数</span><br><strong>${payload.document_count}</strong></div>
        <div class="detail-item"><span class="muted">总切片数</span><br><strong>${payload.total_chunk_count}</strong></div>
      `;
    }

    function renderPages(pages) {
      if (!pages.length) {
        pagesList.innerHTML = "";
        return;
      }

      pagesList.innerHTML = pages.map((item, index) => `
        <div class="page-item">
          <strong>页面 ${index + 1}：</strong>${item.document_name}<br>
          <span class="muted">${item.source_url}</span><br>
          <span class="muted">切片数：${item.chunk_count}</span>
        </div>
      `).join("");
    }

    function appendBubble(type, text, citations = []) {
      const wrapper = document.createElement("div");
      wrapper.className = `bubble ${type}`;
      wrapper.textContent = text;

      if (citations.length > 0) {
        const toggleButton = document.createElement("button");
        toggleButton.type = "button";
        toggleButton.className = "citation-toggle";
        toggleButton.textContent = `查看引用（${citations.length}）`;

        const citationsEl = document.createElement("div");
        citationsEl.className = "citations";
        citationsEl.hidden = true;
        citations.forEach((item, index) => {
          const citation = document.createElement("div");
          citation.className = "citation";
          citation.innerHTML = `
            <strong>引用 ${index + 1}</strong><br>
            ${item.document_name} · chunk ${item.chunk_index} · score ${item.score}<br>
            ${item.snippet}<br>
            <span class="muted">${item.source_url || ""}</span>
          `;
          citationsEl.appendChild(citation);
        });

        toggleButton.addEventListener("click", () => {
          citationsEl.hidden = !citationsEl.hidden;
          toggleButton.textContent = citationsEl.hidden
            ? `查看引用（${citations.length}）`
            : `收起引用（${citations.length}）`;
        });

        wrapper.appendChild(toggleButton);
        wrapper.appendChild(citationsEl);
      }

      chatHistory.appendChild(wrapper);
      chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    ingestButton.addEventListener("click", async () => {
      const url = websiteUrlInput.value.trim();
      const knowledgeBaseName = kbNameInput.value.trim();
      const maxPages = Number(maxPagesInput.value || 5);

      if (!url) {
        setStatus(ingestStatus, "请先输入网站地址。");
        return;
      }

      ingestButton.disabled = true;
      setStatus(ingestStatus, "正在抓取网站并构建知识库，请稍等...");

      try {
        const response = await fetch("/api/v1/rag/ingest-website", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            url,
            knowledge_base_name: knowledgeBaseName || null,
            max_pages: maxPages,
            same_domain_only: sameDomainOnlyInput.checked
          })
        });

        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.detail || "导入失败");
        }

        state.knowledgeBaseId = payload.knowledge_base_id;
        state.pages = payload.pages || [];
        renderDetails(payload);
        renderPages(state.pages);
        askButton.disabled = false;

        setStatus(
          ingestStatus,
          `导入成功，已抓取 ${payload.document_count} 个页面，共生成 ${payload.total_chunk_count} 个切片。`
        );
        appendBubble(
          "answer",
          `网站导入成功，现在你可以开始提问了。\n\n当前知识库：${payload.knowledge_base_name}\n抓取页面：${payload.document_count}`
        );
      } catch (error) {
        setStatus(ingestStatus, error.message || "导入失败");
      } finally {
        ingestButton.disabled = false;
      }
    });

    askButton.addEventListener("click", async () => {
      const question = questionInput.value.trim();
      if (!state.knowledgeBaseId) {
        setStatus(askStatus, "请先导入网站内容。");
        return;
      }
      if (!question) {
        setStatus(askStatus, "请先输入问题。");
        return;
      }

      askButton.disabled = true;
      setStatus(askStatus, "正在检索网站内容并生成回答...");
      appendBubble("user", question);

      try {
        const response = await fetch("/api/v1/rag/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            knowledge_base_id: state.knowledgeBaseId,
            question,
            top_k: 3
          })
        });
        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.detail || "问答失败");
        }

        appendBubble("answer", payload.answer, payload.citations || []);
        questionInput.value = "";
        setStatus(askStatus, "回答完成。");
      } catch (error) {
        appendBubble("answer", `处理失败：${error.message || "问答失败"}`);
        setStatus(askStatus, error.message || "问答失败");
      } finally {
        askButton.disabled = false;
      }
    });

    clearButton.addEventListener("click", () => {
      state.knowledgeBaseId = null;
      state.pages = [];
      websiteUrlInput.value = "";
      kbNameInput.value = "";
      maxPagesInput.value = "5";
      sameDomainOnlyInput.checked = true;
      questionInput.value = "";
      askButton.disabled = true;
      setStatus(ingestStatus, "");
      setStatus(askStatus, "");
      details.innerHTML = '<div class="detail-item">还没有导入网站内容。</div>';
      pagesList.innerHTML = "";
      chatHistory.innerHTML = '<div class="bubble answer">先在左侧输入网站地址并完成导入，然后这里就可以开始问答。</div>';
    });
  </script>
</body>
</html>
