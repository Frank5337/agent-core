spring:
  application:
    name: platform-service
  datasource:
    url: jdbc:h2:mem:platformdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

ai:
  service:
    base-url: http://localhost:8002

management:
  endpoints:
    web:
      exposure:
        include: health,info
